server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"quantmind-frontend"}\n';
    }

    location = / {
        return 302 /quantmind/;
    }

    location = /quantmind {
        return 301 /quantmind/;
    }

    location /quantmind/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /quantmind/index.html;
    }

    location /quantmind-api/ {
        rewrite ^/quantmind-api/(.*)$ /$1 break;
        proxy_pass http://quantmind:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /quantmind-ws/ {
        rewrite ^/quantmind-ws/(.*)$ /$1 break;
        proxy_pass http://quantmind:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
